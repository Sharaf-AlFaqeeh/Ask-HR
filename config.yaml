# AskHR Enterprise AI Orchestration Engine - Configuration File

# General App Environment
app:
  name: "AskHR Enterprise Engine"
  env: "development" # development, staging, production
  debug: true

# LLM Inference Service Settings (llama-cpp-python)
llm:
  service_host: "127.0.0.1"
  service_port: 8000
  # Path to the Qwen GGUF model file inside the project directory
  # Available models:
  # - services/llm_inference_service/models/qwen2.5-3b-instruct-q4_k_m.gguf (Recommended: Balanced)
  # - services/llm_inference_service/models/qwen2.5-1.5b-instruct-q4_k_m.gguf (Fastest)

  model_path: "services/llm_inference_service/models/qwen2.5-3b-instruct-q4_k_m.gguf"
  # model_path: "services/llm_inference_service/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  
  n_ctx: 4096              # Context window size
  n_threads: 8             # Number of CPU threads to use for local execution
  n_gpu_layers: 0          # Number of layers to offload to GPU (0 = CPU only)
  temperature: 0.1         # Lower temperature for precise enterprise responses
  max_tokens: 1024

# Vector Database (Qdrant Local File-based RAG)
vector_db:
  storage_path: "services/vector_db_service/local_qdrant_db"
  collection_name: "hr_policies"
  # fastembed will run locally, downloading a tiny embedding model (e.g. BAAI/bge-small-en-v1.5) on first run
  embedding_model: "BAAI/bge-small-en-v1.5"

# Orchestrator API Service
orchestrator:
  host: "127.0.0.1"
  port: 8081
  # The API endpoint where Orchestrator sends prompts for inference
  llm_api_url: "http://127.0.0.1:8000/v1"
  # Intent Router Confidence Threshold
  intent_confidence_threshold: 0.7
  # Use predefined templates for SAP responses to save time/tokens (true/false)
  use_sap_templates: true
  # NLP analysis mode:
  #   "rule_first"     — (Default) Rule-based NLP primary, LLM fallback only for ambiguous queries. Best balance.
  #   "rule_only"      — Never call LLM for intent analysis. Fastest, but no fallback for complex queries.
  #   "hybrid_always"  — Always run both rule + LLM and merge. Slowest (~5s), use only for debugging.
  nlp_mode: "rule_first"

# Future SAP SuccessFactors Integration Settings (Mock placeholders)
sap:
  api_base_url: "https://mock.successfactors.eu/odata/v2"
  company_id: "HSAGroup"
  client_id: "ask_hr_orchestrator"
  mock_mode: true          # Set to true for local development testing without real SAP connection

# Frontend Service Settings
frontend:
  host: "127.0.0.1"
  port: 8082

# Session Storage Settings (SQLite locally, Redis/DynamoDB in production)
storage:
  type: "sqlite"              # Options: sqlite, redis, in_memory
  session_ttl: 2592000        # Session expiration TTL (30 days in seconds)
  redis:
    host: "127.0.0.1"
    port: 6379
    db: 0
    password: null

